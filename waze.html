<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cop &amp; Traffic Map · Car Dash</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#0b0d10;--card:#161a20;--card2:#1d232b;--fg:#f2f4f7;--mut:#9aa4b2;--acc:#3ea6ff;--waze:#33ccff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;height:100vh;padding:8px;gap:8px}
nav{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
nav a,nav button{flex:1 1 0;min-width:120px;min-height:68px;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 12px;background:var(--card);color:var(--fg);border:2px solid #2a323d;border-radius:14px;font-weight:700;font-size:clamp(19px,1.7vw,25px);line-height:1.1;white-space:nowrap;font-family:inherit;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
nav a:active,nav button:active,nav a:hover,nav button:hover{background:var(--card2);border-color:var(--acc)}
nav .back{background:#c62828;border-color:#c62828;color:#fff;flex:0.8 1 0}
nav .open{background:#0b5f7a;border-color:var(--waze);color:#fff}
nav .ref{background:#1565c0;border-color:#64b5f6;color:#fff}
nav .ref:disabled{opacity:.6}
nav .ttl{flex:1.4 1 0;min-width:240px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(20px,1.8vw,26px);white-space:nowrap;background:#12161b;border-radius:14px;padding:0 12px}
nav .clk{flex:0 0 auto;min-width:200px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;background:#12161b;border:2px solid #2a323d;border-radius:14px;padding:0 14px}
nav .clk small{font-size:18px;color:var(--mut);margin-left:6px}
#st{flex:0 0 auto;display:flex;align-items:center;font-size:18px;font-weight:700;color:var(--mut);padding:0 4px}
#st.ok{color:#a5d6a7}#st.busy{color:#bbdefb}
#mapwrap{position:relative;flex:1 1 auto;min-height:0;border-radius:14px;overflow:hidden;background:#111}
#map{position:absolute;inset:0;width:100%;height:100%;border:0;background:#111}
</style>
</head>
<body>
<nav>
  <a class="back" href="./">⬅ Dash</a>
  <div class="ttl">🚓 Cops &amp; Traffic</div>
  <span class="clk" id="clk">--:--<small>ET</small></span>
  <span id="st">loaded —</span>
  <button id="refresh" class="ref" type="button">🔄 Refresh</button>
  <a class="open" href="https://teslanav.com/" target="_top" rel="noopener">🚙 Open TeslaNav</a>
</nav>
<div id="mapwrap">
  <iframe id="map" title="TeslaNav live map: Waze cops &amp; traffic" allow="geolocation; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
</div>
<script>
// One live map: the free TeslaNav website (teslanav.com: moving map with Waze police and traffic), framed full-size.
// Always on (no time window), no paid API and no gist data on this page. TeslaNav centers on the car via
// geolocation (it has no lat/lon URL parameters). Refresh reloads the iframe. Old ?v=live links land here too.
const SRC='https://teslanav.com/';
const TZ='America/New_York';
(()=>{const u=new URL(location.href);if(u.search){u.search='';history.replaceState(null,'',u);}})();
const f=document.getElementById('map'),st=document.getElementById('st');
const now=sec=>new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',second:sec?'2-digit':undefined,timeZone:TZ});
function load(){st.className='busy';st.textContent='Loading…';f.src=SRC+'?_='+Date.now();}
f.addEventListener('load',()=>{if(!f.src)return;st.className='ok';st.textContent='loaded '+now(false);});
let rT=0;
document.getElementById('refresh').onclick=()=>{clearTimeout(rT);const b=document.getElementById('refresh');b.disabled=true;load();rT=setTimeout(()=>{b.disabled=false;},1500);};
function tick(){document.getElementById('clk').innerHTML=now(true)+'<small>ET</small>';}
tick();setInterval(tick,1000);
load();
</script>
</body>
</html>
